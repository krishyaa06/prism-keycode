    <section class="card keystage" id="stage" tabindex="0">
      <div class="hint" id="hint">Press any key</div>
      <div class="big" id="big"></div>
      <div class="mods" id="mods"><span data-m="Ctrl">Ctrl</span><span data-m="Alt">Alt</span><span data-m="Shift">Shift</span><span data-m="Meta">Meta</span></div>
      <div class="combo" id="combo"></div>
    </section>
    <section class="grid g4 facts" id="facts">
      <div class="card fact"><span>e.key</span><b id="f-key">—</b></div>
      <div class="card fact"><span>e.code</span><b id="f-code">—</b></div>
      <div class="card fact"><span>e.keyCode</span><b id="f-keyCode">—</b></div>
      <div class="card fact"><span>location</span><b id="f-location">—</b></div>
    </section>
    <section class="grid g2">
      <div class="card">
        <div class="card-title"><h2>Snippet</h2><div class="row"><div class="tabs" id="snip"><button class="on" data-v="js">JS</button><button data-v="react">React</button><button data-v="hotkeys">hotkeys.js</button></div><button class="btn small primary" id="copy">Copy</button></div></div>
        <pre class="out" id="code">// press a key</pre>
      </div>
      <div class="card">
        <div class="card-title"><h2>History</h2><button class="btn small" id="clear">Clear</button></div>
        <div class="hist" id="hist"><p class="muted">Keys you press show up here.</p></div>
      </div>
    </section>
